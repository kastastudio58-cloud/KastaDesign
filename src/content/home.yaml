community:
  title:
    ru: Комьюнити womenboss
    en: The womenboss community
  subtitle:
    ru: Развивать своё дело приятнее, когда рядом есть свои.
    en: Growing your business is more enjoyable with your people around.
  text:
    ru: Закрытый чат только для моих клиенток — девушек, которые любят своё дело и понимают, каково это — создавать что-то своё.
    en: A private chat just for my clients — women who love what they do and know what it's like to build something of their own.
  image: /images/home/community.png
  cards:
    - title:
        ru: |-
          Знакомства
          и поддержка
        en: |-
          Connections
          and support
      text:
        ru: Рассказывай о своём проекте, делись опытом и знакомься с другими предпринимательницами.
        en: Share your project and experience, and meet other women entrepreneurs.
    - title:
        ru: |-
          Идеи для
          сотрудничества
        en: |-
          Ideas for
          collaboration
      text:
        ru: Находи единомышленниц для коллабораций, совместных запусков и поддержки проектов друг друга.
        en: Find like-minded women for collaborations, joint launches and supporting each other's projects.
    - title:
        ru: |-
          Полезное
          для твоего бренда
        en: |-
          Useful things
          for your brand
      text:
        ru: Материалы и новости о дизайне, которые помогут в работе над своим делом.
        en: Design materials and news that help you work on your business.
    - title:
        ru: |-
          Предложения
          для своих
        en: |-
          Offers
          for members
      text:
        ru: Специальные условия и бонусы от меня для участниц комьюнити.
        en: Special terms and bonuses from me for community members.
