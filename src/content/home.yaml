process:
  title:
    ru: Коротко о рабочем процессе
    en: How we work, in short
  steps:
    - image: /images/home/process-1.png
      title:
        ru: Знакомство с твоим проектом
        en: Getting to know your project
      text:
        ru: Обсуждаем, что ты создаёшь или хочешь изменить, какие материалы нужны и к какой дате.
        en: We discuss what you are creating or want to change, which materials you need and by when.
    - image: /images/home/process-2.png
      title:
        ru: Расчёт и согласование плана и стоимости
        en: Estimating and agreeing on the plan and cost
      text:
        ru: Определяем объём задач, этапы и сроки. Фиксируем договорённости в договоре и смете.
        en: We define the scope, stages and timeline, and record everything in a contract and estimate.
    - image: /images/home/process-3.png
      title:
        ru: Разработка и доработка
        en: Design and refinement
      text:
        ru: Показываю решения, объясняю, как они связаны с задачей твоего бренда. Обсуждаем и вносим согласованные доработки.
        en: I present the solutions and explain how they serve your brand's goals. We discuss them and make the agreed revisions.
    - image: /images/home/process-4.png
      title:
        ru: Подготовка и передача файлов
        en: Preparing and handing over files
      text:
        ru: Передаю готовые файлы и необходимые инструкции. Подготавливаю все закрывающие материалы.
        en: I hand over the final files and any instructions you need, and prepare all closing documents.
about:
  title:
    ru: Кстати, я Катя
    en: By the way, I'm Katya
  cards:
    - title:
        ru: Дизайн для девушек
        en: Design for women
      text:
        ru: Бренд-дизайнер. Сейчас работаю с девушками, которые любят своё дело и через него помогают другим девушкам. Когда-то я сама была на их месте.
        en: I'm a brand designer. I work with women who love what they do and help other women through it. I was once in their shoes myself.
    - title:
        ru: Из бьюти — в дизайн
        en: From beauty to design
      text:
        ru: До дизайна я 8 лет работала мастером ногтевого сервиса и была сооснователь­ницей студии красоты. Сама оформляла прайсы, визитки и сертификаты. Мне это нравилось, но я не знала, как делать профессионально. Затем я узнала о профессии графического дизайнера, пошла учиться и после года совмещения окончательно сменила сферу.
        en: Before design, I spent 8 years as a nail technician and co-founded a beauty studio. I made our price lists, business cards and gift certificates myself. I loved it but didn't know how to do it professionally. Then I discovered graphic design, went to study, and after a year of combining both, switched careers for good.
    - title:
        ru: Опыт внутри бренда
        en: Experience inside a brand
      text:
        ru: Двухлетний опыт работы в дизайн-отделе косметических брендов помог мне посмотреть на дизайн изнутри бизнеса с миллионными оборотами и понять, как он работает в системе бренда и помогает решать его задачи.
        en: Two years in the design department of cosmetics brands let me see design from inside a business with a multimillion turnover and understand how it works within a brand system and helps solve its goals.
