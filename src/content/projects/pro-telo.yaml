intro:
  ru: Бренд-стратегия, фирменный стиль и сопровождение обновления соцсетей для студии коррекции фигуры в Пензе.
  en: Brand strategy, visual identity and support with a social media refresh for a body-contouring studio in Penza, Russia.
task:
  ru: |-
    Студия выросла, а логотип, сделанный на старте, уже не отражал её подход. По мере расширения команде понадобились общие правила, а заказчице — понятная инструкция для ведения соцсетей.

    - Сформулировать, для кого работает студия, в чём её подход и чем она отличается.
    - Определить, как студия общается с аудиторией и о чём рассказывает в соцсетях.
    - Разработать фирменный стиль и помочь применить его в повседневной работе.
  en: |-
    The studio had grown, and the logo made at launch no longer reflected its approach. As it expanded, the team needed shared rules and the client needed a clear guide for running social media.

    - Define who the studio works for, what its approach is and what sets it apart.
    - Decide how the studio talks to its audience and what it covers on social media.
    - Develop a visual identity and help apply it in everyday work.
solution:
  - title:
      ru: Сформировала основу бренда
      en: Built the brand's foundation
    text:
      ru: |-
        В основу стратегии легла идея, что состояние тела складывается из нескольких взаимосвязанных факторов, в том числе питания, образа жизни и состояния организма. Она помогла сформулировать подход студии и задала направление для айдентики.

        - Собрала ядро бренда, сформулировала большую идею, миссию и ценности, определила архетипы.
        - Проанализировала аудиторию, разработала позиционирование и название.
        - Описала персону бренда и его манеру общения — прямо, уверенно и с юмором. Так команде было на что опереться, когда нужно писать от лица студии.
        - Определила рубрики для соцсетей — экспертные объяснения, знакомство с командой, рассказы о программах и результатах работы.
      en: |-
        The strategy is built on the idea that the body's condition comes from several interconnected factors, including nutrition, lifestyle and overall health. This idea helped define the studio's approach and set the direction for the identity.

        - Assembled the brand core, defined the big idea, mission and values, and chose the archetypes.
        - Analysed the audience and developed the positioning and the name.
        - Described the brand persona and its tone of voice — direct, confident and with humour — so the team had something to rely on when writing for the studio.
        - Set out content pillars for social media: expert explanations, meeting the team, stories about programmes and client results.
  - title:
      ru: Перевела характер студии в фирменный стиль
      en: Turned the studio's character into a visual identity
    text:
      ru: |-
        Предложила два визуальных направления с разным настроением — более лёгкое и более яркое. В выбранной концепции передала прямоту студии через плотную типографику и контрастную палитру, а живую манеру общения — через рукописные детали.

        - **Логотип.** Выбрала плотный гротеск с простыми формами букв, чтобы передать уверенный, прямой характер бренда. Фигурные скобки в версии «Про {Тело}» отсылают к формуле и поддерживают идею, что состояние тела складывается из нескольких факторов. Для небольших форматов разработала компактную версию.
        - **Фирменный знак.** Соединила два полукруга, направленных в разные стороны. Вместе они напоминают силуэт человека и передают идею баланса внешнего и внутреннего.
        - **Палитра.** Глубокий красный передаёт энергию бренда и выделяет главное в ленте — от ключевой мысли до предложения студии. Молочный фон добавляет теплоту и даёт место тексту и фотографиям, а тёмный графит сохраняет чёткий контраст для чтения.
        - **Рукописная графика.** Добавила стрелки, обводки и подчёркивания. Они работают как пометки специалиста во время разговора — помогают увидеть, с чего начать чтение, что запомнить и как связаны отдельные мысли.
      en: |-
        I proposed two visual directions with different moods — a lighter one and a bolder one. In the chosen concept I expressed the studio's directness through dense typography and a contrasting palette, and its lively way of talking through hand-drawn details.

        - **Logo.** I chose a dense grotesque with simple letterforms to convey the brand's confident, direct character. The curly braces in the “Pro {Telo}” version refer to a formula and support the idea that the body's condition is made up of several factors. I also designed a compact version for small formats.
        - **Brand mark.** I joined two semicircles facing opposite ways. Together they resemble a human silhouette and express the balance between the outer and the inner.
        - **Palette.** Deep red conveys the brand's energy and highlights what matters in the feed — from a key idea to the studio's offer. A milky background adds warmth and leaves room for text and photos, while dark graphite keeps reading contrast crisp.
        - **Hand-drawn graphics.** I added arrows, circles and underlines. They work like a specialist's notes during a conversation, showing where to start reading, what to remember and how ideas connect.
  - title:
      ru: Показала стиль на примере ВКонтакте
      en: Showed the style on VK
    text:
      ru: |-
        Уже в презентации показала, как айдентика работает в сообществе и публикациях. Светлые карточки использовала для подробных объяснений, красные — для коротких акцентов. Общая типографика и рукописные пометки связали разные рубрики в одной ленте.

        Заказчица утвердила визуальное решение без правок.
      en: |-
        Already in the presentation I showed how the identity works on the community page and in posts. Light cards were used for detailed explanations, red ones for short accents. Shared typography and hand-drawn notes tied different content pillars together in one feed.

        The client approved the visual direction with no revisions.
  - title:
      ru: Собрала брендбук и помогла внедрить стиль
      en: Put together the brand book and helped roll out the style
    text:
      ru: |-
        - Объединила ДНК бренда, правила общения и айдентику в брендбуке. В него можно заглянуть перед подготовкой публикации или передать новому подрядчику, чтобы ввести его в проект.
        - В течение нескольких месяцев готовила макеты для обновления ВКонтакте и Instagram и помогала составлять посты-карусели.

        Я взяла на себя подготовку дизайна для соцсетей, чтобы заказчица могла продолжать работу со своими клиентками, пока мы обновляли оформление.
      en: |-
        - Brought the brand DNA, communication rules and identity together in a brand book. It can be checked before preparing a post or handed to a new contractor to bring them up to speed.
        - For several months I prepared layouts for the VK and Instagram refresh and helped put together carousel posts.

        I took on the social media design so the client could keep working with her clients while we updated the look.
result:
  ru: |-
    - У команды появился общий ориентир для работы с брендом — от того, как объяснять подход студии, до того, как оформлять публикации.
    - Заказчица получила готовые материалы для обновления двух площадок и поддержку на этапе внедрения.
  en: |-
    - The team now has a shared reference for working with the brand — from how to explain the studio's approach to how to design posts.
    - The client received ready-made materials to refresh two platforms and support during the rollout.
