summary:
  ru: Единый фирменный стиль для пространства с магазином косметики и косметологическими услугами. Подготовила визуал и материалы, помогла с заказом пакетов и сопровождала проект до открытия.
  en: A unified brand identity for a space combining a cosmetics store and beauty treatments. I prepared the visuals and materials, helped order the shopping bags and supported the project through opening.
