intro:
  ru: Фирменный стиль и материалы для бьюти-бутика в Пензе (Россия), где объединились брендовая косметика, косметология и зона с напитками и десертами.
  en: Brand identity and materials for a beauty boutique in Penza, Russia, bringing together branded cosmetics, beauty treatments and a drinks-and-desserts corner.
task:
  ru: |-
    Подготовить визуальное оформление бутика к открытию:
    - Связать фирменный стиль с уже готовым дизайном интерьера.
    - Передать характер бренда: женственность, премиальность и внимательное отношение к каждой гостье.
    - Подготовить материалы с учётом бюджета, сроков производства и требований к вывеске.
  en: |-
    Prepare the boutique's visual identity for opening:
    - Connect the brand identity with the interior design that was already finished.
    - Convey the brand's character: femininity, a premium feel and genuine care for every guest.
    - Prepare the materials within the budget, production timelines and signage requirements.
solution:
  - title:
      ru: Связала интерьер и фирменный стиль
      en: Connected the interior and the brand identity
    text:
      ru: |-
        Предложила два визуальных направления. Заказчица выбрала более мягкое и женственное: тёплую палитру, плавные линии логотипа и изящную типографику.

        Разработала:
        - Три версии логотипа для разных форматов.
        - Цветовую палитру и шрифтовую пару.
        - Графические приёмы и правила использования стиля.

        Так вывеска, упаковка и небольшие печатные материалы складывались в единый узнаваемый образ.
      en: |-
        I proposed two visual directions. The client chose the softer, more feminine one: a warm palette, flowing logo lines and elegant typography.

        I designed:
        - Three logo versions for different formats.
        - A colour palette and a typeface pairing.
        - Graphic devices and usage guidelines.

        This way the sign, packaging and small print pieces added up to one recognisable look.
  - title:
      ru: Подготовила материалы для работы бутика
      en: Prepared the materials for running the boutique
    text:
      ru: |-
        Для пространства и торговой зоны:
        - Вывеску с учётом требований жилого комплекса.
        - Табличку с режимом работы.
        - Фирменные пакеты и стаканчики.
        - Карточки с ценами для торговых полок.

        Для косметологического направления: дизайн памятки после процедуры и чек-листов домашнего ухода. Чтобы рекомендации оставались у клиентки под рукой после визита.
      en: |-
        For the space and the retail area:
        - A sign that meets the residential complex's requirements.
        - An opening-hours plate.
        - Branded shopping bags and cups.
        - Price cards for the shelves.

        For the beauty treatments: an aftercare leaflet and home-care checklists, so clients keep the recommendations at hand after their visit.
  - title:
      ru: Добавила повод поделиться впечатлением
      en: Gave guests a reason to share
    text:
      ru: Разработала открытки с предсказаниями под стирающимся слоем. Небольшой интерактив дополнил покупку приятным сюрпризом — гостьи делились открытками в сторис и упоминали бутик.
      en: I designed scratch-off fortune cards. This small interactive touch turned a purchase into a pleasant surprise — guests shared the cards in their stories and tagged the boutique.
  - title:
      ru: Помогла довести дизайн до производства
      en: Took the design all the way to production
    text:
      ru: |-
        Взяла на себя сопровождение производства пакетов:
        - Подбирала типографии.
        - Сравнивала стоимость и сроки.
        - Согласовывала детали с менеджерами.

        Заказчице оставалось выбирать и утверждать решения. Также помогла найти подрядчика для изготовления и монтажа таблички на дверь.
      en: |-
        I handled production of the shopping bags:
        - Shortlisted print shops.
        - Compared prices and lead times.
        - Agreed the details with their managers.

        The client only had to choose and approve. I also helped find a contractor to make and install the door plate.
  - title:
      ru: Сохранила задумку открыток в рамках бюджета
      en: Kept the card idea within budget
    text:
      ru: |-
        Печать открыток со стирающимся слоем оказалась дороже запланированного. Предложила заказать готовые скретч-наклейки отдельно и нанести их вручную.

        Так сохранили интерактив и сократили расходы на изготовление.
      en: |-
        Printing the scratch-off cards turned out more expensive than planned. I suggested ordering ready-made scratch stickers separately and applying them by hand.

        That kept the interactive touch and cut production costs.
result:
  ru: |-
    К открытию у My Lux были:
    - Единый визуальный стиль.
    - Комплект материалов для торговли, косметологических услуг и сервиса.
    - Решения по производству, подобранные под сроки и бюджет запуска.

    Заказчица получила поддержку от разработки стиля до работы с подрядчиками.
  en: |-
    By opening day My Lux had:
    - A unified visual identity.
    - A full set of materials for retail, beauty treatments and service.
    - Production solutions tailored to the launch timeline and budget.

    The client got support from developing the identity all the way to working with contractors.
