intro:
  ru: Редизайн бренда купальников, который вырос из прежнего оформления. Разработала фирменный стиль, упаковку, печатные материалы, оформление соцсетей и таплинка.
  en: A redesign for a swimwear brand that had outgrown its original look. I developed the visual identity, packaging, print materials, social media design and a Taplink page.
task:
  ru: |-
    У бренда уже были логотип и синий цвет, но ещё не было единой визуальной системы. Аудитория сместилась в более высокий ценовой сегмент, и оформление нужно было привести в соответствие с новым уровнем бренда.

    - Сохранить узнаваемость, опираясь на знакомый синий цвет.
    - Передать через дизайн изящность, женственность, свежесть и удовольствие от жизни.
    - Собрать единый стиль для упаковки, печатных материалов и онлайн-площадок.
  en: |-
    The brand already had a logo and a blue colour, but no unified visual system. Its audience had moved into a higher price segment, and the design needed to match the brand's new level.

    - Keep the brand recognisable by building on the familiar blue.
    - Convey elegance, femininity, freshness and the joy of life through design.
    - Create one style for packaging, print materials and online platforms.
solution:
  - title:
      ru: Обновила палитру и логотип
      en: Updated the palette and the logo
    text:
      ru: |-
        - **Припылённый голубой** сохранил связь с прежним синим и ассоциацию с водой. Приглушённый оттенок сделал подачу спокойнее и оставил акцент на самих купальниках.
        - **Молочный и песочный** добавили тепла. Молочный стал мягким фоном, а песочный напомнил о пляже и прогретом солнцем песке. Тёмный оттенок использовала для текста, чтобы сохранить читаемость.
        - **Плавные линии логотипа** передали женственность, а детали букв, похожие на завязки купальника, связали его с продуктом. Для отдельного знака использовала мотив восходящего солнца, чтобы обыграть название бренда.
      en: |-
        - **Dusty light blue** kept the link to the previous blue and the association with water. The muted shade made the look calmer and kept the focus on the swimsuits themselves.
        - **Milky and sand tones** added warmth. Milky became a soft background, and sand recalls the beach and sun-warmed sand. A dark shade is used for text to keep it readable.
        - **Flowing logo lines** convey femininity, and letter details that resemble swimsuit ties link it to the product. For the standalone mark I used a rising sun motif to play on the brand's name.
  - title:
      ru: Продумала упаковку и маркировку
      en: Designed the packaging and labelling
    text:
      ru: |-
        - **Пакет из дизайнерского картона с атласными ручками.** Плотный картон держит форму, а мягкие ленты с лёгким блеском перекликаются с завязками купальника. Вместе эти детали создают ощущение подарка себе.
        - **Бумага тишью с фирменным паттерном.** Продолжила оформление внутри пакета, чтобы распаковка тоже передавала характер бренда.
        - **Бирки с составником, матовые зип-пакеты, гигиенические стикеры и термопринты.** Оформила в общем стиле и предусмотрела место для информации об изделии, в том числе о составе и размере.
      en: |-
        - **A designer-board bag with satin handles.** The dense board holds its shape, and the soft ribbons with a subtle sheen echo swimsuit ties. Together these details feel like a gift to yourself.
        - **Tissue paper with the brand pattern.** It carries the design inside the bag, so the unboxing expresses the brand's character too.
        - **Hang tags with care labels, frosted zip bags, hygiene stickers and heat-transfer labels.** Designed in the shared style, with space for product information including composition and size.
  - title:
      ru: Добавила детали, которые передают настроение бренда
      en: Added details that carry the brand's mood
    text:
      ru: |-
        - **Овальная визитка с «мокрым» логотипом.** Выборочный лак ловит свет на матовой поверхности и напоминает блик на воде. Так отделка отсылает к теме купальников, а округлая форма визитки подхватывает плавные линии логотипа.
        - **Визитка основательницы с тиснением.** Для неё выбрала дизайнерскую бумагу и рельефную отделку, чтобы сохранить сдержанную подачу и добавить тактильный акцент.
        - **Бирка с плейлистом для примерки.** Предложила включить музыку и примерить новый купальник. Так идея удовольствия от жизни стала частью знакомства с покупкой.
      en: |-
        - **An oval business card with a “wet” logo.** Spot varnish catches the light on the matte surface like a glint on water. The finish nods to swimwear, and the rounded card shape picks up the flowing lines of the logo.
        - **The founder's embossed business card.** I chose designer paper and a raised finish to keep the look understated while adding a tactile touch.
        - **A tag with a try-on playlist.** It invites you to put on some music and try on your new swimsuit, making the joy of life part of getting to know the purchase.
  - title:
      ru: Перенесла стиль в соцсети и таплинк
      en: Carried the style into social media and Taplink
    text:
      ru: |-
        - **Актуальное и закреплённые публикации.** Оформила ключевые разделы, чтобы покупательницам было проще найти каталог, отзывы и информацию о заказе.
        - **Лента и карточки товаров.** Использовала крупные заголовки для навигации по контенту и единый принцип подачи моделей, размеров и цен.
        - **Рекомендации для съёмки.** Предложила сочетать крупные планы купальников с пляжными деталями и живыми кадрами с моделями, чтобы показать и изделие, и настроение бренда.
        - **Фирменный таплинк.** Перенесла в него палитру, типографику и графику, чтобы при переходе из соцсетей сохранялся тот же визуальный образ.
      en: |-
        - **Highlights and pinned posts.** I designed the key sections so shoppers can easily find the catalogue, reviews and ordering information.
        - **Feed and product cards.** Large headlines help navigate the content, and one consistent format presents models, sizes and prices.
        - **Photo shoot guidelines.** I suggested combining swimsuit close-ups with beach details and candid shots of models, to show both the garment and the brand's mood.
        - **Branded Taplink page.** It uses the same palette, typography and graphics, so the look stays the same when people move over from social media.
result:
  ru: Заказчица получила фирменный стиль, который сохранил узнаваемый цвет и придал бренду более спокойный, изящный характер. Подготовила макеты для печати и упаковки, оформление соцсетей и таплинка, а также рекомендации для съёмок, чтобы стиль можно было последовательно применять в новых материалах.
  en: The client received a visual identity that kept the recognisable colour and gave the brand a calmer, more elegant character. I prepared print and packaging artwork, social media and Taplink designs, and photo shoot guidelines so the style can be applied consistently in new materials.
