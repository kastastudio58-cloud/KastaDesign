intro:
  ru: 'Редизайн бренда купальников: от основы фирменного стиля до упаковки, оформления соцсетей и таплинка.'
  en: 'A redesign for a swimwear brand: from the core of the visual identity to packaging, social media design and a Taplink page.'
task:
  ru: |-
    Заказчица пришла с логотипом и синим цветом, вокруг которых ещё не сложилась полноценная визуальная система. Аудитория бренда перешла в более высокий ценовой сегмент, и оформление должно было соответствовать её ожиданиям от продукта.

    Нужно было сохранить узнаваемость, сделать подачу более изящной и передать характер бренда: свежесть, женственность и удовольствие от жизни.
  en: |-
    The client came with a logo and a blue colour that had not yet grown into a full visual system. The brand's audience had moved into a higher price segment, and the design needed to meet their expectations of the product.

    The goal was to keep the brand recognisable, make its look more refined and convey its character: freshness, femininity and the joy of life.
solution:
  - title:
      ru: Сохранила знакомый цвет и сделала палитру мягче.
      en: Kept the familiar colour and softened the palette.
    text:
      ru: |-
        Синий стал связью с прежним оформлением бренда. Я перевела его в припылённый голубой: он сохраняет ассоциации с водой и свежестью, а приглушённость помогает создать спокойную, деликатную подачу, в которой главным остаётся сам купальник.

        Молочный фон добавляет мягкости, песочный оттенок напоминает о тёплой коже и пляже, а тёмный используется для текста. Вместе цвета поддерживают ощущение расслабленного отдыха и сдержанной роскоши.
      en: |-
        Blue became the link to the brand's previous look. I shifted it to a dusty light blue: it keeps the associations with water and freshness, while its muted tone creates a calm, delicate presentation where the swimsuit itself stays the focus.

        A milky background adds softness, a sandy shade recalls warm skin and the beach, and a dark tone is used for text. Together the colours support a feeling of relaxed holidays and understated luxury.
  - title:
      ru: Передала женственность через форму и типографику.
      en: Conveyed femininity through form and typography.
    text:
      ru: |-
        В обновлённом логотипе использовала изящные, плавные линии, созвучные пластике тела. Детали букв напоминают завязки купальника — так знак получает связь с продуктом. Мотив восходящего солнца продолжает название и тему удовольствия от нового дня.

        Выразительную типографику дополнила простым шрифтом для описаний, размеров и цен: эмоциональная подача сочетается с понятной информацией о товаре.
      en: |-
        In the updated logo I used elegant, flowing lines that echo the body's curves. Letter details resemble swimsuit ties, linking the mark to the product. A rising sun motif continues the name and the theme of enjoying a new day.

        I paired the expressive display type with a simple typeface for descriptions, sizes and prices, so the emotional tone sits alongside clear product information.
  - title:
      ru: Продолжила характер бренда в упаковке и тактильных деталях.
      en: Carried the brand's character into packaging and tactile details.
    text:
      ru: |-
        Для пакетов предусмотрела дизайнерский картон и атласные ручки. Мягкая лента с деликатным блеском перекликается с завязками купальника и делает упаковку похожей на подарок себе — это поддерживает идею покупки ради собственного удовольствия.

        Бумага тишью с фирменным паттерном добавляет ещё один этап распаковки и продолжает оформление внутри пакета. Для самих изделий подготовила бирки с составником, матовые зип-пакеты, гигиенические стикеры и термопринты с логотипом и размером.
      en: |-
        For the shopping bags I specified designer board and satin handles. The soft ribbon with a delicate sheen echoes the swimsuit ties and makes the packaging feel like a gift to oneself, supporting the idea of buying for your own pleasure.

        Tissue paper with the brand pattern adds another step to the unboxing and carries the design inside the bag. For the garments themselves I prepared hang tags with care labels, frosted zip bags, hygiene stickers and heat-transfer labels with the logo and size.
  - title:
      ru: Добавила детали, связанные с водой и наслаждением жизнью.
      en: Added details tied to water and the joy of life.
    text:
      ru: |-
        На овальной визитке предусмотрела выборочный лак: блестящий логотип на матовой поверхности напоминает мокрый след и связывает печатный материал с водной тематикой бренда. Округлая форма поддерживает плавность логотипа и всей графической системы.

        Бирку на пакет дополнила плейлистом для примерки нового купальника. Так философия наслаждения выражается в конкретном предложении: включить музыку, уделить время себе и создать настроение ещё до поездки на пляж.
      en: |-
        On the oval business card I used spot varnish: a glossy logo on a matte surface looks like a wet mark and ties the print piece to the brand's water theme. The rounded shape supports the flow of the logo and the whole graphic system.

        I added a playlist for trying on a new swimsuit to the bag tag. This turns the philosophy of pleasure into a concrete invitation: put on some music, take time for yourself and get in the mood before you even reach the beach.
  - title:
      ru: Собрала единую подачу для онлайн-площадок.
      en: Built a consistent look for online platforms.
    text:
      ru: |-
        Разработала оформление актуального, закреплённых публикаций и принципы построения ленты. Крупные заголовки помогают выделить информацию, а единое оформление карточек — последовательно показывать модели, размеры и стоимость.

        В рекомендациях для съёмки соединила детали купальников, пляжные аксессуары и живые эмоции. Это позволяет показывать и сам продукт, и настроение, с которым его выбирают. Фирменный таплинк продолжает ту же визуальную систему при переходе из соцсетей.
      en: |-
        I designed the highlight covers, pinned posts and guidelines for building the feed. Large headlines make information stand out, and consistent card design shows models, sizes and prices in a clear sequence.

        In the photo shoot guidelines I combined swimsuit details, beach accessories and genuine emotion, so the content shows both the product and the mood in which it is chosen. The branded Taplink page continues the same visual system when people move over from social media.
result:
  ru: |-
    Заказчица получила целостную основу для дальнейшего развития бренда. Обновлённый стиль сохранил связь с прежним оформлением и получил более спокойную, изящную подачу, соответствующую задаче перехода в более высокий ценовой сегмент.

    Единая система охватила упаковку, печатные материалы и онлайн-площадки — от первого знакомства в соцсетях до распаковки купальника.
  en: |-
    The client got a coherent foundation for growing the brand further. The updated identity kept its link to the previous look and gained a calmer, more refined presentation that fits the move into a higher price segment.

    One system now covers packaging, print materials and online platforms — from the first encounter on social media to unboxing the swimsuit.
