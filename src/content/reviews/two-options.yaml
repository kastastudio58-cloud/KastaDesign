name: Отзыв про два варианта
text:
  ru: |-
    Катюшаааа кайф какой 😍😍
    Оба варианта 🔥🔥🔥🔥
    Первый с калькой супер 👌🏻
    Но сделаем вариант номер 2, двусторонний 🙌🏻 без улучшения пока 👌🏻
    Начнём с малых высот , потом будем с масштабом увеличивать 😏
  en: |-
    Katyaaaa this is amazing 😍😍
    Both options 🔥🔥🔥🔥
    The first one with tracing paper is great 👌🏻
    But let's go with option 2, double-sided 🙌🏻 no upgrades for now 👌🏻
    We'll start small, then scale up 😏
